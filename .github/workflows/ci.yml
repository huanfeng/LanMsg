name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (fmt, clippy, test, packaging)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libx11-dev libxkbcommon-dev libwayland-dev libdbus-1-dev \
            shellcheck jq

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash | bash -s -- 1.7.7 "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: No CJK in Rust string literals
        run: python3 scripts/check-no-cjk.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Web page tests
        run: node --test web/test/*.test.mjs

      - name: Packaging checks
        run: bash scripts/check-packaging.sh --fast

  windows:
    name: Windows (desktop, daemon)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test -p lanmsg-desktop -p lanmsgd

  android:
    name: Android (unit tests)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 platform-tools ndk;28.2.13676358

      - name: Export NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo ndk --version 2>/dev/null | grep -q " 4.1.2$" || cargo install cargo-ndk --locked --force --version 4.1.2

      - name: Build native libraries and Kotlin bindings
        run: bash scripts/build-android-core.sh debug

      # Robolectric 每次运行都会从 Maven Central 下载 Android SDK 的 jar 到 ~/.m2；网络抖动时一批测试
      # 会以 MavenArtifactFetcher 的 IOException 失败（与代码无关，2026-11-26 连续三次出现）。
      # 按 Robolectric 版本缓存，版本不变就命中；不设 restore-keys，避免版本变了还用旧 jar。
      # 缓存分成 restore 与 save 两步，save 用 always()：actions/cache 默认在 job 失败时不保存，
      # 而下载失败本身就会让 job 失败，于是缓存永远存不下来、一直循环失败。
      # 这样保存是安全的：Robolectric 先下载到临时文件，完成后才移动到最终路径，
      # 路径里只会有完整的 jar，失败的 job 也不会留下残缺文件。
      # 注意缓存按分支隔离：特性分支保存的缓存 main 读不到，要在 main 上跑一次才会生效。
      - name: Restore Robolectric SDK jars
        id: robolectric-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml') }}

      - name: Gradle unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Save Robolectric SDK jars
        if: always() && steps.robolectric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml') }}
