[package]
name = "lanmsg-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lanmsg-proto = { path = "../lanmsg-proto" }
lanmsg-api = { path = "../lanmsg-api" }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
directories = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.13"
x509-parser = "0.16"
ipnet = "2"
time = "0.3"

[dev-dependencies]
tempfile = "3"
