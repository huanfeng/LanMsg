[package]
name = "lanmsg-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# 仅供集成测试：允许缩短心跳 / 空闲超时（生产构建不启用）。
test-hooks = []

[dependencies]
lanmsg-proto = { path = "../lanmsg-proto" }
lanmsg-api = { path = "../lanmsg-api" }
lanmsg-localsend = { path = "../lanmsg-localsend" }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
directories = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "aws_lc_rs"] }
x509-parser = "0.16"
ipnet = "2"
time = "0.3"
rand = "0.8"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
hmac = "0.12"
sha2 = "0.10"
data-encoding = "2"
blake3 = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
crypto_secretbox = "0.1"
hkdf = "0.12"
serde_json = "1"
scrypt = { version = "0.11", default-features = false }
zeroize = { version = "1", features = ["derive"] }
fs4 = { version = "0.13", features = ["sync"] }
lanmsg-web-assets = { path = "../lanmsg-web-assets" }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "ws", "json"] }

# 应用内更新（T23）：HTTPS 拉取 GitHub Releases（显式 aws-lc-rs provider，与 lanmsg-localsend 一致）。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-no-provider"] }

# 平台密钥库：桌面端专用，Android / iOS 构建不拉入。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }

# 防火墙放行的提权（ShellExecuteExW runas）只在 Windows 编译。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
lanmsg-core = { path = ".", features = ["test-hooks"] }
tempfile = "3"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.24"
