[package]
name = "lanmsgd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# desktop：托盘、通知与界面拉起（依赖 windui）；无头构建（musl）关闭。
default = ["desktop"]
desktop = ["dep:windui"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink"] }
image = { version = "0.25", default-features = false, features = ["png"] }
lanmsg-api = { version = "0.1.0", path = "../lanmsg-api" }
lanmsg-core = { version = "0.1.0", path = "../lanmsg-core" }
lanmsg-proto = { version = "0.1.0", path = "../lanmsg-proto" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = "0.3"
windui = { path = "../../../../windinput/wind-ui-rust", optional = true }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
