[package]
name = "lanmsg-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lanmsg-thumb"
path = "src/bin/lanmsg-thumb.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
lanmsg-proto = { version = "0.1.0", path = "../lanmsg-proto" }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Foundation"] }
