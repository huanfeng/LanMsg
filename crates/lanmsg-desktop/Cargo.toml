[package]
name = "lanmsg-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lanmsg"
path = "src/main.rs"

[dependencies]
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ipnet = "2"
lanmsg-api = { path = "../lanmsg-api" }
lanmsg-core = { path = "../lanmsg-core" }
lanmsg-media = { path = "../lanmsg-media" }
lanmsg-proto = { path = "../lanmsg-proto" }
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
windui = { git = "https://github.com/huanfeng/wind-ui-rust", tag = "v0.32.0" }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_System_Time"] }
