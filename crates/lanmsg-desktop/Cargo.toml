[package]
name = "lanmsg-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lanmsg"
path = "src/main.rs"

[dependencies]
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
lanmsg-api = { version = "0.1.0", path = "../lanmsg-api" }
lanmsg-core = { version = "0.1.0", path = "../lanmsg-core" }
lanmsg-media = { version = "0.1.0", path = "../lanmsg-media" }
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
windui = { path = "../../../../windinput/wind-ui-rust" }

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_System_Time"] }
